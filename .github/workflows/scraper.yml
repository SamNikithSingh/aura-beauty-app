name: Aura Price Scraper Automation

on:
  schedule:
    # Runs 3 times a day: every 8 hours (00:00, 08:00, 16:00 UTC)
  - cron: "0 */6 * * *"
  workflow_dispatch:
    # Allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './scraper/package-lock.json'

      - name: Install Scraper Dependencies
        run: |
          cd scraper
          npm ci

      - name: Run Scraper
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_ANON_KEY }}
          # Tell Puppeteer to use its bundled Chromium (not system Chrome)
          PUPPETEER_EXECUTABLE_PATH: ''
        run: |
          cd scraper
          npm run scrape 2>&1 | tee scraper.log

      - name: Upload Scraper Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs-${{ github.run_id }}
          path: scraper/scraper.log
          retention-days: 7
